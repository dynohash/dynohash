name: I tested my card
description: Tell us how DynoHash runs on your card. It helps everyone with the same card.
title: "Card test: "
labels: ["card-test"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! Numbers from your own rig only.

  - type: input
    id: card
    attributes:
      label: Card
      description: The full model name. More than one card? One report per model.
      placeholder: AMD Radeon RX 9070 XT
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Ubuntu 24.04
        - Other Linux
        - HiveOS
        - mmpOS
        - Other
    validations:
      required: true

  - type: input
    id: driver
    attributes:
      label: Driver version
      description: AMD Adrenalin or ROCm version, or the NVIDIA driver version.
      placeholder: "25.10.2"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: DynoHash version
      description: In the app, open About. On the command line, run `dynohash --version`.
      placeholder: dynohash 0.1.0
    validations:
      required: true

  - type: dropdown
    id: tune
    attributes:
      label: Tune
      options:
        - After a dyno pull
        - Stock
        - My own settings
    validations:
      required: true

  - type: input
    id: ths
    attributes:
      label: Speed (TH/s)
      description: After 10 minutes of mining or more. From the app or the log.
      placeholder: "118"
    validations:
      required: true

  - type: input
    id: watts
    attributes:
      label: Power (watts)
      description: What DynoHash shows for the card. Not sure? Leave it blank.
      placeholder: "300"

  - type: textarea
    id: slip
    attributes:
      label: Time slip
      description: Posted a time slip? Paste the link, or drop in a screenshot of the slip.

  - type: textarea
    id: notes
    attributes:
      label: Anything else?
      description: Crashes, temperatures, fan noise, odd log lines.

  - type: checkboxes
    id: privacy
    attributes:
      label: Before you post
      options:
        - label: I removed my wallet address and passwords from everything above.
          required: true
